<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فیلم‌های جفتک | عربی هفتم</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.fontcdn.ir/Font/Persian/Vazirmatn/Vazirmatn.css" rel="stylesheet">
</head>
<body>

    <!-- هدر -->
    <header class="main-header">
        <div class="header-content">
            <h1>🎬 فیلم‌های جفتک 🎬</h1>
            <p>یادگیری عربی با تماشا!</p>
        </div>
    </header>

    <!-- دکمه بازگشت به خانه -->
    <div class="container" style="padding-bottom: 0;">
        <a href="index.html" class="back-btn">⬅️ بازگشت به صفحه اصلی</a>
    </div>

    <!-- بخش فیلم‌ها -->
    <main class="container">
        <section class="videos-section">
            
            <!-- کارت ویدیو ۱ (نمونه) -->
            <div class="video-card">
                <h3>📖 درس ششم - بخش اول</h3>
                <div class="video-wrapper">
                    <!-- اینجا اسم فایل ویدیویی که توی پوشه videos گذاشتی رو بنویس -->
                    <video controls poster="">
                        <source src="videos/lesson6-1.mp4" type="video/mp4">
                        مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
                    </video>
                </div>
                <p>توضیح کوتاه: در این فیلم با واژگان درس ششم آشنا می‌شوی.</p>
            </div>

            <!-- کارت ویدیو ۲ (نمونه) -->
            <div class="video-card">
                <h3>📖 درس ششم - بخش دوم</h3>
                <div class="video-wrapper">
                    <video controls poster="">
                        <source src="videos/lesson6-2.mp4" type="video/mp4">
                        مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
                    </video>
                </div>
                <p>توضیح کوتاه: تمرین‌های درس ششم و حل مثال‌ها.</p>
            </div>

        </section>
    </main>

    <footer class="main-footer">
        <p>ساخته شده با ❤️ برای دانش‌آموزان پایه هفتم</p>
    </footer>

</body>
</html>
